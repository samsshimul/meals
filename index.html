<title>52/8 Accounts</title>
<style>
:root{
  --bg:#f4f3ef;--surface:#fcfcfb;--surface-2:#f0efec;--ink:#0b0b0b;--ink-2:#52514e;--muted:#898781;
  --line:#e1e0d9;--axis:#c3c2b7;--ring:rgba(11,11,11,.10);
  --blue:#2a78d6;--blue-ink:#1c5cab;--blue-soft:#e3eefc;
  --orange:#eb6834;--red:#e34948;--red-ink:#b42f2f;--red-soft:#fbe7e6;
  --good:#0ca30c;--good-ink:#006300;--good-soft:#e2f4e2;--warn:#fab219;
  --accent:#184f95;--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
  --r:14px;color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0d0d0d;--surface:#1a1a19;--surface-2:#242422;--ink:#f0efec;--ink-2:#c3c2b7;--muted:#898781;
  --line:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);
  --blue:#3987e5;--blue-ink:#86b6ef;--blue-soft:#16263b;
  --orange:#d95926;--red:#e66767;--red-ink:#f19a9a;--red-soft:#3a1d1d;
  --good-ink:#3ccf3c;--good-soft:#16301a;--accent:#86b6ef;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue-ink)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:#fff;flex:none}
:root[data-theme="dark"] .logo{color:#0d0d0d}
.brand h1{font-size:17px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:12px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.dot.busy{background:var(--warn)}.dot.err{background:var(--red)}
select.month{padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--axis)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0d0d0d}
.btn.wa{background:#1f9d55;border-color:#1f9d55;color:#fff}
.btn.danger{color:var(--red-ink)}
.btn.sm{padding:4px 9px;font-size:13px;border-radius:8px}
.btn.icon{padding:7px 9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:7px 13px;border-radius:999px;text-decoration:none;color:var(--ink-2);white-space:nowrap;font-weight:500}
nav.tabs a.on{background:var(--ink);color:var(--bg)}
main{padding:18px 0 90px}
.banner{border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px;background:var(--blue-soft);color:var(--ink)}
.banner.warn{background:color-mix(in srgb,var(--warn) 22%,var(--surface))}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--ring);padding:16px;min-width:0}
.card h2{font-size:15px;margin:0 0 2px}
.card .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.kpi .lab{font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}
.kpi .val{font-size:24px;font-weight:700;margin-top:4px;letter-spacing:-.01em}
.kpi .hint{font-size:12px;color:var(--muted)}
.kpi.hero{background:var(--accent);color:#fff;border-color:transparent}
.kpi.hero .lab,.kpi.hero .hint{color:rgba(255,255,255,.8)}
:root[data-theme="dark"] .kpi.hero{background:#184f95}
.rowflex{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.pos{color:var(--blue-ink)}.neg{color:var(--red-ink)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.receive{background:var(--blue-soft);color:var(--blue-ink)}
.pill.pay{background:var(--red-soft);color:var(--red-ink)}
.pill.done{background:var(--good-soft);color:var(--good-ink)}
.pill.even{background:var(--surface-2);color:var(--ink-2)}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.t th{font-size:12px;color:var(--ink-2);text-align:right;font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t tr.me td{background:color-mix(in srgb,var(--blue) 8%,transparent)}
table.t tfoot td{font-weight:700;border-bottom:none}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* grids */
.sheet{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:12px}
.sheet table{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:13px}
.sheet th,.sheet td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;text-align:center;min-width:46px;height:34px;background:var(--surface)}
.sheet thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);font-weight:600;font-size:12px;padding:4px 2px;line-height:1.1}
.sheet thead th small{display:block;color:var(--muted);font-weight:400}
.sheet th.name,.sheet td.name{position:sticky;left:0;z-index:1;text-align:left;padding:0 10px;min-width:92px;font-weight:600;background:var(--surface-2)}
.sheet thead th.name{z-index:3}
.sheet td.tot,.sheet th.tot{font-weight:700;min-width:64px;background:var(--surface-2)}
.sheet tfoot td{font-weight:700;background:var(--surface-2)}
.sheet .today{background:color-mix(in srgb,var(--blue) 12%,var(--surface))}
.sheet input{width:100%;height:33px;border:0;background:transparent;text-align:center;padding:0 2px;-moz-appearance:textfield}
.sheet input::-webkit-inner-spin-button{display:none}
.sheet input:focus{outline:2px solid var(--blue);outline-offset:-2px;background:var(--surface)}
.sheet .zero{color:var(--muted)}
/* quick entry */
.qe{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.qe .m{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.qe .m b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:var(--surface-2);width:34px;height:34px;cursor:pointer;font-size:18px}
.stepper input{width:54px;border:0;text-align:center;height:34px;background:var(--surface)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
input.in,select.in,textarea.in{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);min-width:0;width:100%}
textarea.in{resize:vertical}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid var(--blue);outline-offset:-1px}
.report{white-space:pre-wrap;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface-2);border-radius:12px;padding:14px;max-height:520px;overflow:auto;margin:0}
.mcard{border:1px solid var(--line);border-radius:12px;padding:12px}
.mcard.me{border-color:var(--blue)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;border-radius:99px;background:var(--good)}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 8px;background:var(--surface-2);border-radius:8px;flex-wrap:wrap;min-width:0}
.muted{color:var(--muted)}.small{font-size:13px}
.chart{width:100%;position:relative}
.chart svg{display:block;overflow:visible}
.chart text{font-size:12px;fill:var(--ink-2);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-bottom:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#tip{position:fixed;pointer-events:none;z-index:100;background:var(--ink);color:var(--bg);font-size:12px;padding:7px 9px;border-radius:8px;max-width:240px;opacity:0;transition:opacity .1s;white-space:pre-line;line-height:1.4}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;padding:20px;width:min(420px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 12px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:120;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.bill{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.shares{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:6px;margin-top:10px}
.share{display:flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--line);border-radius:9px;padding:4px 6px}
.share input[type=number]{width:66px;border:1px solid var(--line);border-radius:7px;padding:4px 6px;background:var(--surface);text-align:right}
.share span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.switch{position:relative;display:inline-block;width:42px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--axis);transition:.2s;cursor:pointer}
.switch i:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+i{background:var(--good)}
.switch input:checked+i:before{transform:translateX(18px)}
.me-card{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.me-card .big{font-size:30px;font-weight:800;letter-spacing:-.02em}
.eq{font:13px ui-monospace,Menlo,Consolas,monospace;color:var(--ink-2);word-break:break-all}
.hide{display:none!important}
.stmt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:14px;font-size:14px}
.stmt td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.stmt td.amt{text-align:right;font-weight:700;white-space:nowrap}
.stmt td small{display:block;color:var(--muted);font-size:12px}
.stmt tr.hd td{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);background:var(--surface-2);font-weight:600;padding:6px}
.stmt tr.total td{font-size:17px;font-weight:800;border-bottom:none;border-top:2px solid var(--ink);padding-top:10px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:0}
.final{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:2px}
.final span{font-size:15px;font-weight:600}
.final b{font-size:30px;font-weight:800;letter-spacing:-.02em}
.stackwrap{margin-top:14px}
.stacklab{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);margin:10px 0 4px}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px}
.stack i{display:block;height:100%;min-width:3px}
.anim-grow{transform-origin:left center;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
.anim-grow-r{transform-origin:right center;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.fade-up{animation:fadeup .5s ease-out both}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}}
.rep-head{background:linear-gradient(135deg,#184f95,#2a78d6);color:#fff;border-radius:var(--r);padding:20px;margin-bottom:14px}
.rep-head h2{font-size:22px;margin:4px 0 14px}
.rep-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.rep-kpis div{background:rgba(255,255,255,.13);border-radius:12px;padding:10px 12px}
.rep-kpis b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.rep-kpis span{font-size:12px;opacity:.85}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);margin-bottom:14px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.hbar{display:grid;grid-template-columns:70px 1fr 1fr 84px;align-items:center;font-size:13px;padding:6px 0}
.hbar .l{display:flex;justify-content:flex-end;border-right:1px solid var(--axis);height:18px}
.hbar .r{display:flex;justify-content:flex-start;height:18px}
.hbar i{display:block;height:18px}
@media (prefers-reduced-motion:reduce){.anim-grow,.anim-grow-r,.fade-up{animation:none}}
@media (max-width:760px){.rep-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.final b{font-size:26px}}
.daystrip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.dayb{flex:none;width:52px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.dayb small{font-size:11px;color:var(--muted)}.dayb b{font-size:17px}.dayb span{font-size:11px;color:var(--ink-2)}
.dayb.today{border-color:var(--blue)}
.dayb.on{background:var(--accent);border-color:var(--accent);color:#fff}.dayb.on small,.dayb.on span{color:rgba(255,255,255,.85)}
.mealrows{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:8px;margin-top:10px}
.mealrow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;flex-wrap:wrap}
.mealrow>b{min-width:62px;flex:1}
.qchips{display:flex;gap:4px}
.q{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:34px;height:34px;cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums}
.q.on{background:var(--blue);border-color:var(--blue);color:#fff}
.statrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.statrow div{background:var(--surface-2);border-radius:10px;padding:8px 10px}.statrow span{display:block;font-size:12px;color:var(--ink-2)}.statrow b{font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calh{font-size:11px;color:var(--muted);text-align:center;padding:2px 0}
.cald{border-radius:8px;min-height:50px;padding:4px 6px;display:flex;flex-direction:column;justify-content:space-between;background:var(--surface-2)}
.cald small{font-size:11px;color:var(--muted)}.cald b{font-size:17px;text-align:right}
.lv1{background:#cde2fb}.lv2{background:#9ec5f4}.lv3{background:#5598e7;color:#fff}.lv4{background:#256abf;color:#fff}.lv5{background:#184f95;color:#fff}
.lv3 small,.lv4 small,.lv5 small{color:rgba(255,255,255,.8)}
:root[data-theme="dark"] .lv1{background:#16263b}:root[data-theme="dark"] .lv2{background:#184f95;color:#fff}
.lvk{display:inline-block;width:14px;height:14px;border-radius:4px;margin:0 1px;vertical-align:-2px}
.blog{display:flex;flex-direction:column}
.blogd{font-size:12px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.blogr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.bwho{min-width:64px}.bitems{flex:1;display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-width:160px}
.itag{background:color-mix(in srgb,var(--orange) 14%,var(--surface));border-radius:999px;padding:2px 9px;font-size:13px}.itag i{font-style:normal;color:var(--ink-2);font-size:12px}
.bamt{font-variant-numeric:tabular-nums;min-width:70px;text-align:right}
.whorow{display:grid;grid-template-columns:96px 1fr 84px 52px;align-items:center;gap:8px;padding:5px 0;font-size:14px}
.whorow b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.whorow span{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.whobar{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}.whobar i{display:block;height:100%;background:var(--blue);border-radius:0 4px 4px 0}
.bzgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;margin-top:6px}
.bzside{background:var(--surface-2);border-radius:12px;padding:12px}
.flab{font-size:12px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}
.bzside .flab:first-child{margin-top:0}
.catalog{max-height:330px;overflow:auto;margin-top:8px;border:1px solid var(--line);border-radius:12px;padding:8px}
.cgt{font-size:12px;font-weight:700;color:var(--muted);margin:6px 0 4px}
.ichips{display:flex;flex-wrap:wrap;gap:5px}
.ichip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer}
.ichip.on{background:var(--orange);border-color:var(--orange);color:#fff}
.selrow{display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:14px}.selrow span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selrow input{width:86px;border:1px solid var(--line);border-radius:8px;padding:5px 7px;background:var(--surface);text-align:right}
.big-in{font-size:22px;font-weight:700;padding:10px 12px}
.cellb{width:100%;height:33px;border:0;background:transparent;cursor:pointer;font:inherit;color:inherit}.cellb:hover{background:var(--blue-soft)}
@media (max-width:760px){.bzgrid{grid-template-columns:1fr}.statrow{grid-template-columns:repeat(2,minmax(0,1fr))}.mealrows{grid-template-columns:1fr}.whorow{grid-template-columns:72px 1fr 74px 40px}.cald{min-height:42px;padding:3px 4px}.cald b{font-size:15px}}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;object-fit:cover;flex:none;font-weight:700;vertical-align:middle;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--ring)}
.chip .av{width:22px!important;height:22px!important;font-size:9px!important;margin:-2px 6px -2px -6px;border-width:1px}
.mstrip{display:flex;gap:10px;overflow-x:auto;padding:8px 2px 2px}

<script>
/* ===================== Seed (used for first setup & preview) ===================== */
const SEED = {members:[],settings:{houseName:'52/8 Accounts'},months:{}};

/* ===================== Helpers ===================== */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round(((+n)||0)*100+Number.EPSILON*100)/100;
const num=n=>{const v=r2(n);return Number.isInteger(v)?String(v):v.toFixed(2)};
const money=n=>{const v=r2(n);return (DB.settings&&DB.settings.currency||'\u09f3')+v.toLocaleString('en-US',{minimumFractionDigits:Number.isInteger(v)?0:2,maximumFractionDigits:2})};
const uid=()=>Math.random().toString(36).slice(2,9);
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const monthLabel=k=>{const[y,m]=k.split('-');return MONTHS[+m-1]+' '+y};
const monthShort=k=>{const[y,m]=k.split('-');return MONTHS[+m-1].slice(0,3)+' '+y.slice(2)};
const daysIn=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate()};
const keyOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const prevKey=k=>{const[y,m]=k.split('-').map(Number);return keyOf(new Date(y,m-2,1))};
const nextKey=k=>{const[y,m]=k.split('-').map(Number);return keyOf(new Date(y,m,1))};
const sum=a=>(a||[]).reduce((s,v)=>s+((+v)||0),0);
const LS={get(k,d){try{const v=localStorage.getItem('mm_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('mm_'+k,JSON.stringify(v))}catch(e){}}};
const deepCopy=o=>JSON.parse(JSON.stringify(o));
function toast(msg,ms=2200){const t=$('#toast');t.textContent=msg;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,ms)}

/* ===================== API (Google Apps Script or preview) ===================== */
const IS_GAS=typeof google!=='undefined'&&google.script&&google.script.run;
/* The installable phone app (hosted outside Google) talks to the same Google script through a small JSON API. */
const API_URL=(typeof window!=='undefined'&&window.MM_API)||'';
const REMOTE=!IS_GAS&&!!API_URL;
const READ_ONLY_FN=/^api(Get|WhoAmI|AdminInfo|ListMods|BookingLinks)/;
async function remoteCall(fn,args){
  const tries=READ_ONLY_FN.test(fn)?3:1;let last;
  for(let i=0;i<tries;i++){
    try{
      const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args}),redirect:'follow',cache:'no-store'});
      const j=await r.json();
      if(j&&j.ok)return j.r;
      const e=new Error((j&&j.err)||'Server error');e.server=true;throw e;
    }catch(e){if(e.server)throw e;last=e;if(i<tries-1)await new Promise(r=>setTimeout(r,700*(i+1)))}
  }
  throw new Error('No connection. Check your internet and try again.');
}
function gas(fn,...args){if(REMOTE)return remoteCall(fn,args);return new Promise((res,rej)=>{google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e&&e.message?e:new Error(String(e))))[fn](...args)})}
const demo={
  db:null,
  load(){this.db=LS.get('demo_db',null)||Object.assign(deepCopy(SEED),{updatedAt:Date.now()});return this.db},
  persist(){this.db.updatedAt=Date.now();LS.set('demo_db',this.db)},
  window(){const d=this.db||this.load();const t=new Date();const today=t.getFullYear()+'-'+pad2(t.getMonth()+1)+'-'+pad2(t.getDate());const dates=[];for(let i=-1;i<=7;i++)dates.push(addDays(today,i));
    const data={};dates.forEach(ds=>{data[ds]=((d.book||{})[ds.slice(0,7)]||{})[String(+ds.slice(8))]||{}});return{dates,data,today,hour:t.getHours()}},
  setBook(ds,id,c){const d=this.db||this.load();d.book=d.book||{};const ym=ds.slice(0,7),day=String(+ds.slice(8));d.book[ym]=d.book[ym]||{};d.book[ym][day]=d.book[ym][day]||{};
    const cc={l:c.l?1:0,d:c.d?1:0,g:Math.max(0,+c.g||0),by:'website',at:new Date().toISOString()};d.book[ym][day][id]=cc;const bs=bookSet();
    const M=d.months[ym];if(bs.fillSheet&&M&&(M.members||[]).includes(id)&&M.meals[id])M.meals[id][+day-1]=r2((cc.l?+bs.lunchValue:0)+(cc.d?+bs.dinnerValue:0)+cc.g);this.addLog('Booking \u00b7 '+id+' \u00b7 '+ds+': '+choiceTxt(cc),[]);this.persist()},
  addLog(action,lines){const d=this.db||this.load();d.log=d.log||[];const s=this.sess||{};d.log.push({t:new Date().toISOString(),who:s.role==='owner'?'Owner':s.name||'System',role:s.role||'system',month:'',action,details:lines.join('\n')});if(d.log.length>500)d.log.shift()}
};
const api=(IS_GAS||REMOTE)?{
  getState:()=>gas('apiGetState',ui.token||null,(DB&&DB.photos&&DB.photoVer)||null),
  getMonth:k=>gas('apiGetMonth',k),
  savePhoto:(t,id,d)=>gas('apiSavePhoto',t,id,d),
  adminInfo:t=>gas('apiAdminInfo',t),
  makePdf:(t,k,id)=>gas('apiMakePdf',t,k,id),
  backupExcel:t=>gas('apiBackupExcel',t),
  logoutAll:t=>gas('apiLogoutAll',t),
  fullBackup:t=>gas('apiFullBackup',t),
  getVersion:()=>gas('apiGetVersion'),
  login:pw=>gas('apiLogin',pw),
  save:(t,p)=>gas('apiSave',t,p),
  listMods:t=>gas('apiListMods',t),
  saveMod:(t,m)=>gas('apiSaveMod',t,m),
  removeMod:(t,id)=>gas('apiRemoveMod',t,id),
  getLog:(t,o,l,w)=>gas('apiGetLog',t,o,l,w),
  whoAmI:b=>gas('apiWhoAmI',b),
  confirm:(b,ds,c,via)=>gas('apiConfirm',b,ds,c,via),
  book:(b,ds,c,via)=>gas('apiBook',b,ds,c,via),
  setUsual:(b,u)=>gas('apiSetUsual',b,u),
  staffBook:(t,id,ds,c)=>gas('apiStaffBook',t,id,ds,c),
  staffUsual:(t,id,u)=>gas('apiStaffUsual',t,id,u),
  bookingLinks:t=>gas('apiBookingLinks',t),
  resetBookingLink:(t,id)=>gas('apiResetBookingLink',t,id),
  sendBookingReminders:(t,all)=>gas('apiSendBookingReminders',t,all),
  checkReplies:t=>gas('apiCheckRepliesNow',t),
  changePassword:(t,o,n)=>gas('apiChangePassword',t,o,n),
  sendEmails:(t,k,mode,ids)=>gas('apiSendEmails',t,k,mode,ids||null),
  backupNow:t=>gas('apiBackupNow',t),
  restore:(t,j)=>gas('apiRestore',t,j)
}:{
  async getState(){if(!demo.sess&&ui.token){const db0=demo.db||demo.load();const mid=String(ui.token).startsWith('demo-mod-')?ui.token.slice(9):null;const mm=mid&&(db0.mods||[]).find(x=>x.id===mid);demo.sess=mm?{role:'mod',id:mid,name:(db0.members.find(x=>x.id===mid)||{}).name||mid,perms:mm.perms}:{role:'owner',name:'Owner',perms:{meals:1,bazar:1,bills:1,settle:1}}}
    if(!ui.token)demo.sess=null;const d=deepCopy(demo.db||demo.load());delete d.mods;delete d.log;d.book=demo.window();d.admin=!!ui.token&&ui.role==='owner';d.session=ui.token?(demo.sess||{role:'owner',name:'Owner',perms:{meals:1,bazar:1,bills:1,settle:1}}):null;if(!(ui.token&&ui.role==='owner'))d.members=d.members.map(m=>({id:m.id,name:m.name,active:m.active}));return d},
  async getVersion(){return (demo.db||demo.load()).updatedAt},
  async getMonth(k){return deepCopy((demo.db||demo.load()).months[k]||null)},
  async savePhoto(t,id,d){const db=demo.db||demo.load();db.photos=db.photos||{};if(d)db.photos[id]=d;else delete db.photos[id];demo.persist();return db.updatedAt},
  async adminInfo(){return{owner:'(preview)',triggers:[],emailQuota:null,lastBackup:'',lastAuto:'',webUrl:''}},
  async makePdf(){throw new Error('Preview mode: PDFs are created by the deployed Google version.')},
  async backupExcel(){throw new Error('Preview mode: Excel backups are made by the deployed Google version.')},
  async logoutAll(){return true},
  async fullBackup(){return deepCopy(demo.db||demo.load())},
  async login(pw){const d=demo.db||demo.load();d.mods=d.mods||[{id:'afif',pw:'mod123',perms:{meals:true,bazar:true,bills:false,settle:false},active:true}];
    if(pw==='admin'){demo.sess={role:'owner',name:'Owner',perms:{meals:1,bazar:1,bills:1,settle:1}};demo.addLog('Logged in',[]);return Object.assign({token:'demo-owner'},demo.sess)}
    const m=d.mods.find(x=>x.active!==false&&x.pw===pw);if(!m)throw new Error('Wrong password');
    demo.sess={role:'mod',id:m.id,name:(d.members.find(x=>x.id===m.id)||{}).name||m.id,perms:m.perms};demo.addLog('Logged in',[]);return Object.assign({token:'demo-mod-'+m.id},demo.sess)},
  async listMods(){const d=demo.db||demo.load();d.mods=d.mods||[];return d.mods.map(m=>({id:m.id,name:(d.members.find(x=>x.id===m.id)||{}).name||m.id,perms:m.perms,active:m.active!==false}))},
  async saveMod(t,m){const d=demo.db||demo.load();d.mods=d.mods||[];let x=d.mods.find(q=>q.id===m.id);if(!x){if(!m.password)throw new Error('Set a password for the new moderator');x={id:m.id,pw:m.password,perms:m.perms,active:true};d.mods.push(x);demo.addLog('Made '+m.id+' a moderator',[])}
    else{x.perms=m.perms;if(m.active!=null)x.active=m.active;if(m.password)x.pw=m.password;demo.addLog('Updated moderator '+m.id,[])}demo.persist();return this.listMods()},
  async removeMod(t,id){const d=demo.db||demo.load();d.mods=(d.mods||[]).filter(m=>m.id!==id);demo.persist();return this.listMods()},
  async whoAmI(b){const d=demo.db||demo.load();const id=String(b).replace(/^demo-/,'');const m=d.members.find(x=>x.id===id);if(!m)throw new Error('This personal link is not valid any more.');return{id,name:m.name}},

function compute(k){

  });

  const leftCollect=r2(sum(rows.filter(r=>r.due<0).map(r=>-r.due))),leftPay=r2(sum(rows.filter(r=>r.due>0).map(r=>r.due)));

  const collected=r2(sum(rows.filter(r=>r.status==='pay').map(r=>r.paid)));
  const paidOut=r2(sum(rows.filter(r=>r.status==='receive').map(r=>r.paid)));

}

function equation(r){
  const parts=[];const pos=r.mealBal>=0;let start=Math.abs(r.mealBal);let val=start;
  const add=(amt,isCharge)=>{ // charge reduces receivable
    const sign=(pos?(isCharge?'-':'+'):(isCharge?'+':'-'));parts.push(sign+num(amt));val+= (sign==='+'?amt:-amt)};
  r.billItems.forEach(b=>add(b.amt,true));
  r.dueItems.forEach(d=>add(d.amt,d.dir<0));
  val=r2(val);
  // val is in the direction of the starting sign
  let finalIsReceive=pos?val>=0:val<0;
  const res=Math.abs(val);
  const lab=r.status==='even'?'settled':(finalIsReceive?L().receive:L().pay);
  const eq=num(start)+parts.join('')+'='+(val<0?'-':'')+num(Math.abs(val))+(val<0?' \u2192 '+num(res):'');
  return{eq,lab,res};
}

}

/* ===================== Saving ===================== */
const pending={months:new Set(),members:false,settings:false};let saveTimer=null,saving=false;
function setSync(state,text){$('#syncDot').className='dot'+(state==='busy'?' busy':state==='err'?' err':'');$('#syncText').textContent=text}
function queueSave(what,k){if(!isStaff())return;if(what==='members'&&!can('members'))return;if(what==='settings'&&!can('settings')&&!can('bazar'))return;if(what==='month')pending.months.add(k||ui.month);else{pending[what]=true;if(ui.month)pending.months.add(ui.month)}
  setSync('busy','Unsaved\u2026');clearTimeout(saveTimer);saveTimer=setTimeout(flush,700)}
async function flush(){
  if(saving){clearTimeout(saveTimer);saveTimer=setTimeout(flush,400);return}
  const p={},sent={};if(pending.members&&can('members'))p.members=DB.members;if(pending.settings)p.settings=DB.settings;
  if(pending.months.size){p.months={};pending.months.forEach(k=>{const M=DB.months[k];
    if(!M){if(can('months'))p.months[k]={del:true};return}
    const rep=buildReport(k);
    if(!ui.base[k]){M.report=rep;p.months[k]={create:deepCopy(M)};sent[k]=deepCopy(M);return}
    const ops=diffMonth(ui.base[k],M);ui.lastRep=ui.lastRep||{};
    if(repKey(rep)!==repKey(ui.base[k].report)){
      if(ui.forceReport||ui.repDue===k||Date.now()-(ui.lastRep[k]||ui.loadedAt||0)>20000){ops.push({t:'report',v:rep});ui.lastRep[k]=Date.now();if(ui.repDue===k)ui.repDue=null}
      else{clearTimeout(ui.repTimer);ui.repTimer=setTimeout(()=>{ui.repTimer=null;ui.repDue=k;pending.months.add(k);flush()},21000)}}
    if(ops.length){p.months[k]={ops};sent[k]=deepCopy(M)}});
    if(!Object.keys(p.months).length)delete p.months}
  pending.months.clear();pending.members=false;pending.settings=false;
  if(!Object.keys(p).length){if(ui.offline)setSync('err','Offline');else setSync('ok','Saved');return}
  saving=true;setSync('busy','Saving\u2026');
  try{const res=await api.save(ui.token,p);DB.updatedAt=res.updatedAt;let others=false;
    Object.keys(res.months||{}).forEach(k=>{const merged=res.months[k];
      if(merged===null){delete ui.base[k];delete DB.index[k];return}
      ensureMonthShape(merged,k);const local=DB.months[k];const since=local&&sent[k]?diffMonth(sent[k],local):[];
      const mine=sent[k]?deepCopy(sent[k]):null;ui.base[k]=deepCopy(merged);
      if(mine){const a=deepCopy(merged),b=mine;delete a.report;delete b.report;ensureMonthShape(b,k);if(JSON.stringify(diffMonth(b,a))!=='[]')others=true}
      if(since.length){applyOps(merged,since);ensureMonthShape(merged,k);pending.months.add(k)}
      DB.months[k]=merged;DB.index[k]=lightOf(k);
      if(repKey(buildReport(k))!==repKey(merged.report)&&!ui.repTimer){ui.repTimer=setTimeout(()=>{ui.repTimer=null;ui.repDue=k;pending.months.add(k);flush()},21000)}});
    setSync('ok','Saved '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));
    if(others){const a=document.activeElement;if(!(a&&/INPUT|TEXTAREA/.test(a.tagName)))render();setSync('ok','Saved \u00b7 includes others\u2019 latest changes')}
    if(pending.months.size){clearTimeout(saveTimer);saveTimer=setTimeout(flush,500)}}
  catch(e){handleErr(e);setSync('err','Save failed');
    if(/PERM|locked/i.test((e&&e.message)||'')){Object.keys(p.months||{}).forEach(k=>{if(ui.base[k])DB.months[k]=deepCopy(ui.base[k])});render()}
    else{if(p.months)Object.keys(p.months).forEach(k=>pending.months.add(k));if(p.members)pending.members=true;if(p.settings)pending.settings=true}}
  saving=false;
}
function handleErr(e){const m=(e&&e.message)||String(e);if(/AUTH/.test(m)){logout();toast('Your login expired. Please log in again.')}else if(/PERM/.test(m)){toast(m.replace(/^.*PERM:\s*/,'Not allowed: '),4000)}else toast(m,3500)}
async function refresh(force){
  try{
    const v=await api.getVersion();ui.offline=false;
    if(!force&&v===DB.updatedAt)return setSync('ok','Up to date');
    if(!force&&(pending.months.size||pending.members||pending.settings||saving))return;
    const a=document.activeElement;if(!force&&a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.id!=='monthSel')return;
    const prevMonths=DB.months||{},prevPhotos=DB.photos,prevPV=DB.photoVer;DB=await api.getState();if(DB.photos==null){DB.photos=prevPhotos||{};}else if(REMOTE)LS.set('cache_photos',DB.photos);DB.index=DB.index||{};
    if(REMOTE){try{const c=Object.assign({},DB);delete c.photos;delete c.session;localStorage.setItem('mm_cache_db',JSON.stringify(c))}catch(e){}}
    Object.keys(prevMonths).forEach(k=>{if(!DB.months[k]&&DB.index[k])DB.months[k]=prevMonths[k]});
    if(ui.token){if(DB.session)setSession(DB.session);else if(DB.admin===false)setSession(null)}
    Object.keys(DB.months).forEach(k=>{if(!prevMonths[k]||!ui.base[k]||DB.months[k]!==prevMonths[k])snapBase(k)});
    if(!DB.months||!Object.keys(DB.months).length){DB.months=DB.months||{}}
    if(!ui.month||!allMonthKeys().includes(ui.month)||(!ui.monthPicked&&ui.month!==latestMonth())){ui.month=latestMonth();ui.qeDay=ui.bzDay=null}
    if(ui.month&&!DB.months[ui.month])await ensureMonth(ui.month);
    render();setSync('ok','Updated '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));if(isStaff()&&!force)upgradeReports();
    ui.offline=false;
  }catch(e){ui.offline=true;setSync('err','Offline');console.error(e)}
}

  return`M${x},${y+h}v-${h-rad}a${rad},${rad} 0 0 1 ${rad},-${rad}h${w-2*rad}a${rad},${rad} 0 0 1 ${rad},${rad}v${h-rad}z`;// top
}

}

async function loadAdminInfo(){if(!(can('backup')||can('settings')||can('reports')))return;try{ui.info=await api.adminInfo(ui.token);if(ui.tab==='admin'){const y=scrollY;render();scrollTo(0,y)}}catch(e){handleErr(e)}}

/* ===================== Meal booking ===================== */
const USUALS=[['both','Lunch + Dinner'],['lunch','Lunch only'],['dinner','Dinner only'],['none','No meal']];
const cutLabel=h=>{h=+h;return h>=24?'12:00 AM (midnight)':((h%12)||12)+':00 '+(h<12?'AM':'PM')};
const usualName=u=>(USUALS.find(x=>x[0]===u)||[0,'No usual plan'])[1];
function bookSet(){const b=Object.assign({enabled:true,lunchValue:1,dinnerValue:1,cutoffHour:24,reminder:{enabled:true,hours:[21,23]},onlyUnanswered:true,fillSheet:true,defaultUsual:'none',usual:{},summaryToManager:true,cookEmail:'',replyByEmail:true,replyReceipt:false},S().booking||{});
  b.reminder=Object.assign({enabled:true},b.reminder||{});if(!Array.isArray(b.reminder.hours))b.reminder.hours=[+b.reminder.hour||21];b.usual={};b.cutoffHour=+b.cutoffHour;if(!(b.cutoffHour>=1&&b.cutoffHour<=24))b.cutoffHour=24;return b}
const usualChoice=u=>u==='both'?{l:1,d:1,g:0}:u==='lunch'?{l:1,d:0,g:0}:u==='dinner'?{l:0,d:1,g:0}:u==='none'?{l:0,d:0,g:0}:null;
function choiceTxt(c){if(!c)return'Not answered';const p=[];if(c.l)p.push('Lunch');if(c.d)p.push('Dinner');let t=p.length?p.join(' + '):'No meal';if(c.g)t+=' + '+c.g+' guest';return t}
const pad2=n=>String(n).padStart(2,'0');
function addDays(ds,n){const[y,m,d]=ds.split('-').map(Number);const t=new Date(Date.UTC(y,m-1,d+n));return t.getUTCFullYear()+'-'+pad2(t.getUTCMonth()+1)+'-'+pad2(t.getUTCDate())}
function bkLabel(ds,rel){const B=DB.book||{};const[y,m,d]=ds.split('-').map(Number);const t=new Date(Date.UTC(y,m-1,d));const base=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][t.getUTCDay()]+' '+d+' '+MONTHS[m-1].slice(0,3);
  if(!rel)return base;if(ds===B.today)return'Today \u00b7 '+base;if(ds===addDays(B.today,1))return'Tomorrow \u00b7 '+base;return base}
const bkTom=()=>DB.book&&DB.book.today?addDays(DB.book.today,1):null;
function bkCanChange(ds){const B=DB.book||{};const tom=bkTom();if(!tom)return false;const lt=keyOf(new Date())+'-'+pad2(new Date().getDate());const now=lt>B.today?lt:B.today;if(ds!==addDays(now,1))return false;if(bookSet().cutoffHour>=24)return true;if(ds===tom){const h=keyOf(new Date())+'-'+pad2(new Date().getDate())===B.today?new Date().getHours():B.hour;return h<bookSet().cutoffHour}return false}
const bkStaffSet=c=>!!c&&(c.s==='staff'||(!c.s&&/^staff/.test(c.by||'')));
const bkStaffName=c=>{const m=/\(([^)]+)\)/.exec((c&&c.by)||'');return m?m[1]:'the manager'};
const bkGet=(ds,id)=>((DB.book||{}).data||{})[ds]&&DB.book.data[ds][id]||null;
function bkIds(ds){const k=ds.slice(0,7);const M=DB.months[k];return M?M.members:DB.members.filter(m=>m.active!==false).map(m=>m.id)}
function bkSummary(ds){let l=0,d=0,g=0;const ask=[],L=[],D=[],none=[];const bs=bookSet();
  bkIds(ds).forEach(id=>{const c=bkGet(ds,id);if(!c){ask.push(id);return}if(c.l){l++;L.push(id)}if(c.d){d++;D.push(id)}if(!c.l&&!c.d)none.push(id);g+=c.g||0});
  const lu=ask.map(id=>usualChoice(bs.usual[id]));const lE=l+lu.filter(c=>c&&c.l).length,dE=d+lu.filter(c=>c&&c.d).length;
  return{l,d,g,ask,L,D,none,lE,dE}}
function cookText(ds){const s=bkSummary(ds);const n=id=>nameOf(id);
  return'*\ud83c\udf7d\ufe0f Meals for '+bkLabel(ds)+'*\n\n\ud83c\udf5b Lunch: *'+s.l+'*'+(s.L.length?' ('+s.L.map(n).join(', ')+')':'')+'\n\ud83c\udf19 Dinner: *'+s.d+'*'+(s.D.length?' ('+s.D.map(n).join(', ')+')':'')+(s.g?'\n\ud83d\udc65 Guest meals: '+s.g:'')+(s.none.length?'\n\u274c No meal: '+s.none.map(n).join(', '):'')+(s.ask.length?'\n\u2753 Not answered: '+s.ask.map(n).join(', '):'')}

const srcOf=(M,id,i)=>(((M||{}).mealSrc||{})[id]||{})[i]||null;
const SRC_MARK={self:'\u2713',staff:'\u2605',book:'\u25cb'};
function srcTip(src){if(!src)return'';const t=src.t?new Date(src.t).toLocaleString([], {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
  return src.s==='self'?'Confirmed by '+(src.w||'the member')+' '+t:src.s==='staff'?'Entered by '+(src.w||'staff')+' '+t:'Booked only, not confirmed yet'}
function srcBadge(src){if(!src)return'<span class="srcb none">not confirmed</span>';return`<span class="srcb ${src.s}" title="${esc(srcTip(src))}">${SRC_MARK[src.s]} ${src.s==='self'?'confirmed by '+esc(src.w||'member'):src.s==='staff'?'entered by '+esc(src.w||'staff'):'booked only'}</span>`}
function vConfirmCard(me){
  const B=DB.book,bs=bookSet();if(!B||!B.today)return'';const days=[addDays(B.today,-1),B.today];
  let h=`<div class="card" style="margin-bottom:14px"><h2>What did you actually eat?</h2><p class="sub">Booking is only a plan. Please confirm what you really ate, so your meal count is right. You can confirm today and yesterday.</p><div class="bkdays">`;
  days.forEach(ds=>{const k=ds.slice(0,7),M=DB.months[k],i=+ds.slice(8)-1;
    if(!M||!M.members.includes(me.id)){h+=`<div class="bkrow"><div class="bkd"><b>${esc(bkLabel(ds,true))}</b><small class="muted">${M?'You are not in this month':'Month not started yet'}</small></div></div>`;return}
    const src=srcOf(M,me.id,i),bk=bkGet(ds,me.id),cur=(src&&src.c)||bk||{l:0,d:0,g:0},done=src&&(src.s==='self'||src.s==='staff'),dis=M.closed?'disabled':'';
    h+=`<div class="bkrow ${done?'set':''}"><div class="bkd"><b>${esc(bkLabel(ds,true))}</b><small>${srcBadge(src)} \u00b7 sheet: <b>${num(M.meals[me.id][i])}</b>${bk&&!done?' \u00b7 booked '+esc(choiceTxt(bk)):''}</small></div>
      <div class="bkbtns"><button class="bkb ok ${cur.l?'on':''} ${done?'':'ghost'}" data-act="cfMe" data-ds="${ds}" data-k="l" ${dis}>\ud83c\udf5b Lunch</button><button class="bkb ok ${cur.d?'on':''} ${done?'':'ghost'}" data-act="cfMe" data-ds="${ds}" data-k="d" ${dis}>\ud83c\udf19 Dinner</button>
      <div class="gstep"><span>\ud83d\udc65</span><div class="stepper sm"><button data-act="cfMeG" data-ds="${ds}" data-v="-1" ${(cur.g||0)>0&&!M.closed?'':'disabled'} aria-label="Remove a guest meal">\u2212</button><span>${cur.g||0}</span><button data-act="cfMeG" data-ds="${ds}" data-v="1" ${dis} aria-label="Add a guest meal">+</button></div></div>
      ${done?'':`<button class="btn sm primary" data-act="cfMeOk" data-ds="${ds}" ${dis}>\u2713 ${cur.l||cur.d||cur.g?'Yes, this is right':'I ate nothing'}</button>`}</div></div>`});
  return h+`</div></div>`}

function updateGridTotals(field){
  const C=compute(ui.month),M=C.M;
  C.ids.forEach(id=>{const c=$(`[data-rowtot="${id}"]`);if(c)c.textContent=num(sum(M[field][id]))});
  for(let i=0;i<C.days;i++){const c=$(`[data-daytot="${i}"]`);if(c)c.textContent=num(sum(C.ids.map(id=>M[field][id][i])))||''}
  const g=$('#grandTot');if(g)g.textContent=num(field==='meals'?C.totalMeals:C.totalBazar);
  const gs=$('#gridSum');if(gs)gs.textContent=field==='meals'?num(C.totalMeals)+' meals':money(C.totalBazar)+' total';
}

async function startMonth(k){
  if(!(await confirmBox('Start '+monthLabel(k)+'? Active members and monthly bills will be carried over.','Start')))return;
  const ks=allMonthKeys().filter(x=>x<k);const pk=ks[ks.length-1];if(pk)await ensureMonth(pk);const P=pk?DB.months[pk]:null;
  const N={members:DB.members.filter(m=>m.active!==false).map(m=>m.id),meals:{},bazar:{},bazarLog:[],bills:[],dues:[],payments:[],note:''};
  if(P)(P.bills||[]).filter(b=>b.recurring).forEach(b=>{const nb=Object.assign(deepCopy(b),{id:uid(),paid:false});Object.keys(nb.shares||{}).forEach(id=>{if(!N.members.includes(id))delete nb.shares[id]});N.bills.push(nb)});
  DB.months[k]=ensureMonthShape(N,k);ui.month=k;ui.monthPicked=k!==latestMonth();ui.qeDay=ui.bzDay=null;queueSave('month',k);render();toast(monthLabel(k)+' started');
}
async function flushNow(){clearTimeout(saveTimer);ui.forceReport=true;Object.keys(DB.months).forEach(k=>{if(ui.base[k]&&repKey(buildReport(k))!==repKey(ui.base[k].report))pending.months.add(k)});try{await flush();if(pending.months.size)await flush()}finally{ui.forceReport=false}}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copied! Paste it in WhatsApp or anywhere.')}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copied!')}catch(_){toast('Select the text and copy manually')}ta.remove()}}
function offerFile(name,content,type){
  let url='';try{url=URL.createObjectURL(new Blob([content],{type}))}catch(e){}
  modal(`<h3>Export</h3><p class="small muted">Download the file, or copy its content if downloads are blocked on this device.</p>${url?`<a class="btn primary" href="${url}" download="${esc(name)}">Download ${esc(name)}</a>`:''} <button class="btn" id="cpx">Copy content</button><textarea class="in" rows="6" style="margin-top:10px" readonly>${esc(content.slice(0,200000))}</textarea><div class="rowflex" style="justify-content:flex-end;margin-top:10px"><button class="btn" id="cx">Close</button></div>`,bg=>{$('#cx',bg).onclick=closeModal;$('#cpx',bg).onclick=()=>copyText(content)})}

/* ===================== Install as an app ===================== */
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let installEvt=null;
function setupInstall(){
  const b=$('#installBtn');if(!b||!REMOTE||isStandalone())return;
  b.style.display='';
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e});
  addEventListener('appinstalled',()=>{b.style.display='none';toast('\u2705 Installed! Open "52/8" from your home screen.',4000)});
  b.onclick=async()=>{
    if(installEvt){installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;return}
    const ios=isIOS(),safari=ios&&/safari/i.test(navigator.userAgent)&&!/crios|fxios|edgios|opios|gsa\//i.test(navigator.userAgent);
    modal((ios?`<h3>\ud83d\udcf2 Install on iPhone</h3>${safari?'':'<div class="banner warn" style="margin:0 0 10px"><b>First open this page in Safari.</b> Copy the link, open Safari, paste it, then do the steps below.</div>'}
      <ol style="padding-left:20px;line-height:1.9;margin:0"><li>Tap the <b>Share</b> button <span style="display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px">\u2b06\ufe0e</span> at the bottom (or top) of Safari.</li><li>Scroll down and tap <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>.</li></ol><p class="small muted">The app icon appears on your home screen. Open it from there.</p>`
      :`<h3>\ud83d\udcf2 Install on Android</h3><ol style="padding-left:20px;line-height:1.9;margin:0"><li>Open this page in <b>Chrome</b>.</li><li>Tap the <b>\u22ee</b> menu at the top right.</li><li>Tap <b>Install app</b> (or <b>Add to Home screen</b>), then <b>Install</b>.</li></ol><p class="small muted">The app icon appears on your home screen and in your app list.</p>`)+
      `<div class="rowflex" style="margin-top:12px"><button class="btn" id="cpLink">Copy link</button><button class="btn primary" id="okInst">OK</button></div>`,bg=>{
      $('#cpLink',bg).onclick=()=>copyText(location.origin+location.pathname);$('#okInst',bg).onclick=closeModal});
  };
}
if(REMOTE&&'serviceWorker' in navigator)addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});

/* ===================== Boot ===================== */
setupInstall();
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!ui.theme){applyTheme();drawCharts()}});
(async()=>{
  if(REMOTE){const c=LS.get('cache_db',null);if(c&&c.months){DB=c;DB.photos=LS.get('cache_photos',{})||{};DB.index=DB.index||{};Object.keys(DB.months).forEach(k=>snapBase(k));ui.month=latestMonth();try{route()}catch(e){}setSync('','Updating\u2026')}}
  await refresh(true);route();upgradeReports();
  const getLoc=cb=>{if(IS_GAS&&google.script.url)google.script.url.getLocation(cb);else{const q={};new URLSearchParams(location.search).forEach((v,k)=>q[k]=v);cb({parameter:q})}};
  const clearParams=h=>{if(IS_GAS){try{google.script.history.replace(null,{},h)}catch(e){}}else{try{history.replaceState(null,'',location.pathname+(h?'#'+h:location.hash))}catch(e){}}};
  try{getLoc(loc=>{const p=(loc&&loc.parameter)||{};if(p.month&&allMonthKeys().includes(p.month)&&p.month!==latestMonth()){ui.month=p.month;ui.monthPicked=true;ui.fromLink=true}
    if(p.b){(async()=>{if(await bkIdentify(p.b,!!((p.d||p.a)&&p.c))){if(p.a&&p.c){const c={l:/l/.test(p.c)&&p.c!=='none'?1:0,d:/d/.test(p.c)?1:0,g:0};const M0=DB.months[p.a.slice(0,7)];const s0=srcOf(M0,ui.bme.id,+p.a.slice(8)-1);if(s0&&s0.c)c.g=s0.c.g||0;await cfSave(p.a,c,'email')}
      if(p.d&&p.c){const c={l:/l/.test(p.c)&&p.c!=='none'?1:0,d:/d/.test(p.c)?1:0,g:0};const old=bkGet(p.d,ui.bme.id);if(old)c.g=old.g||0;await bkSaveMine(p.d,c,p.via==='email'?'email':p.via==='whatsapp'?'whatsapp':'website');toast('\u2713 Saved for '+bkLabel(p.d)+': '+choiceTxt(c),4000)}location.hash='book';render()}})()}
    if(p.month||p.view||p.member||p.b)clearParams(p.b?'book':'');if(p.member){ui.repMember=p.member}
    if(p.view==='report'){ui.repView='visual';if(location.hash!=='#report')location.hash='report';else render()}else render()})}catch(e){}
setInterval(()=>{if(!document.hidden)refresh(false)},30000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh(false);else if(isStaff()&&ui.repTimer){clearTimeout(ui.repTimer);ui.repTimer=null;flushNow()}});
  addEventListener('pagehide',()=>{if(isStaff()&&(ui.repTimer||pending.months.size)){clearTimeout(ui.repTimer);ui.repTimer=null;flushNow()}})})();
</script>
